<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waei — Fleet maintenance for UAE SMEs</title>
<meta name="description" content="Waei helps UAE small fleets track preventive maintenance, repairs, costs, and driver defects in one place. Pilot now open.">
<meta name="theme-color" content="#185FA5">

<!-- Open Graph / social previews -->
<meta property="og:title" content="Waei — Fleet maintenance, simplified.">
<meta property="og:description" content="Built for UAE small fleets. Track preventive maintenance, repairs, costs, and driver defects in one place.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://waei.ae">

<style>
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #ffffff;
    color: #042C53;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .page {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .wrap {
    max-width: 640px;
    width: 100%;
    text-align: center;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 3rem;
    font-size: 18px;
    font-weight: 500;
    color: #042C53;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 40px;
    height: 40px;
    background: #185FA5;
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-weight: 500;
    font-size: 18px;
  }
  h1 {
    font-size: clamp(32px, 5vw, 44px);
    font-weight: 500;
    color: #042C53;
    margin: 0 0 1rem;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .lede {
    font-size: clamp(15px, 2vw, 18px);
    color: #5F5E5A;
    margin: 0 auto 2.5rem;
    max-width: 480px;
    line-height: 1.6;
  }
  .cta-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 3rem;
  }
  .btn {
    padding: 13px 26px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: #185FA5;
    color: #ffffff;
    border: 1px solid #185FA5;
  }
  .btn-primary:hover { background: #0C447C; border-color: #0C447C; }
  .btn-secondary {
    background: #ffffff;
    color: #185FA5;
    border: 1px solid #B5D4F4;
  }
  .btn-secondary:hover { background: #E6F1FB; border-color: #185FA5; }
  .meta {
    border-top: 1px solid #E8E6DE;
    padding-top: 1.75rem;
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    font-size: 13px;
    color: #888780;
  }
  .meta a { color: #888780; text-decoration: none; }
  .meta a:hover { color: #185FA5; }
  .footer-text {
    margin-top: 2rem;
    font-size: 12px;
    color: #B4B2A9;
  }
  .icon {
    display: inline-block;
    width: 14px;
    height: 14px;
    vertical-align: -2px;
    margin-right: 6px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="wrap">

    <div class="brand">
      <span class="brand-mark">W</span>
      <span>Waei</span>
    </div>

    <h1>Fleet maintenance, simplified.</h1>

    <p class="lede">
      Built for UAE small fleets. Track preventive maintenance, repairs, costs, and driver defects in one place.
    </p>

    <div class="cta-row">
      <a href="https://app.waei.ae" class="btn btn-primary">Customer login →</a>
      <a href="mailto:hello@waei.ae?subject=Waei%20Fleet%20%E2%80%94%20Pilot%20request" class="btn btn-secondary">Request a pilot</a>
    </div>

    <div class="meta">
      <span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <a href="mailto:hello@waei.ae">hello@waei.ae</a>
      </span>
      <span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Dubai, UAE
      </span>
    </div>

    <p class="footer-text">
      Waei.ae · © 2026
    </p>

  </div>
</div>

</body>
</html>
